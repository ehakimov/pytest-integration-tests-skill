# GitLab CI. Secrets: masked CI/CD variables with the same names as in .env.example.
.autotests:
  stage: test
  image: python:3.12          # UI: mcr.microsoft.com/playwright/python:v<version from requirements.txt>-noble
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: {files: [requirements.txt]}
    paths: [.cache/pip]
  before_script:
    - pip install -r requirements.txt
  script:
    - pytest -m "$TEST_MARK" --env="$TEST_ENV" -n "$THREAD_COUNT" --alluredir=allure-results --junitxml=report.xml
  artifacts:
    when: always
    paths: [allure-results, report.xml]
    reports: {junit: report.xml}
    expire_in: 14 days

.marks:
  smoke: &marks_smoke "smoke"

smoke_staging:
  extends: .autotests
  variables: {TEST_ENV: staging, TEST_MARK: *marks_smoke, THREAD_COUNT: "4"}
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
      allow_failure: true     # a manual run does not block the pipeline; a scheduled run fails it

# Allure TestOps (optional): ALLURE_ENDPOINT, ALLURE_TOKEN, ALLURE_PROJECT_ID in CI/CD variables.
# allurectl watch creates the launch itself and uploads results while the tests run.
.testops:
  variables:
    ALLURE_RESULTS: allure-results
    ALLURE_LAUNCH_NAME: "$TEST_ENV $CI_JOB_NAME $CI_COMMIT_SHORT_SHA"
  before_script:
    - pip install -r requirements.txt
    - curl -fsSL https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64 -o allurectl
    - chmod +x allurectl
  script:
    - ./allurectl watch -- pytest -m "$TEST_MARK" --env="$TEST_ENV" -n "$THREAD_COUNT" --alluredir=allure-results --junitxml=report.xml
