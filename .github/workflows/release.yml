name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    name: Skill zips for the Claude app
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the plugin version
        run: |
          version=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != plugin.json version $version"; exit 1; }
      - run: python tools/package_skills.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
